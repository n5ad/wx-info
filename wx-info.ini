[general]
NODE = YOUR NODE NUMBER 
WX_CODE = ZIP OR AIRPORT 
WX_LOCATION = CITY, STATE
TEMP_UNIT = F # (C or F)

# Uncomment only one below for the style you want for time

TIME_FORMAT = %b %d %I:%M  %p %Z       # Oct 26 07:54  PM CDT (default)
#TIME_FORMAT = %Y-%m-%d %H:%M:%S   # 2026-10-26 19:52:14
#TIME_FORMAT = %b %d, %Y %I:%M %p  # Oct 26, 2026 07:52 PM
#TIME_FORMAT = %d-%b-%Y %H:%M %Z   # 26-Oct-2026 19:52 CDT




[autosky]
MASTER_ENABLE = TRUE
ALERT_INI = /usr/local/bin/AUTOSKY/AutoSky.ini
WARNINGS_FILE - /var/www/html/AUTOSKY/warnings.txt

